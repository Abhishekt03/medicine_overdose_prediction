<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Medicine Overdose Prediction - Login</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <style>
    :root {
      --primary-color: #94c045;
      --secondary-color: #3c4133;
      --accent-color: #aacd6b;
      --light-bg: #f8f9fa;
      --dark-text: #333;
    }
    
    body {
      font-family: 'Open Sans', sans-serif;
      background-color: var(--light-bg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-container {
      max-width: 400px;
      width: 100%;
      padding: 20px;
    }
    
    .login-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    .login-header {
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    
    .login-header h3 {
      margin: 0;
      font-weight: 700;
    }
    
    .login-header p {
      margin: 10px 0 0;
      opacity: 0.9;
    }
    
    .login-body {
      padding: 30px;
    }
    
    .form-label {
      font-weight: 600;
      color: var(--secondary-color);
      margin-bottom: 8px;
    }
    
    .input-group-text {
      background-color: #f8f9fa;
      border-right: none;
    }
    
    .form-control {
      border-left: none;
      padding-left: 5px;
    }
    
    .form-control:focus {
      box-shadow: none;
      border-color: #ced4da;
    }
    
    .form-control:focus + .input-group-text {
      border-color: #ced4da;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      border: none;
      padding: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(148, 192, 69, 0.3);
    }
    
    .alert {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
    }
    
    .password-toggle {
      cursor: pointer;
      background: #f8f9fa;
      border-left: none;
    }
    
    .login-footer {
      text-align: center;
      padding: 20px 0 0;
      border-top: 1px solid #eee;
      margin-top: 20px;
    }
    
    .demo-accounts {
      background-color: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      font-size: 14px;
    }
    
    .demo-accounts h6 {
      margin-bottom: 10px;
      color: var(--secondary-color);
    }
    
    .demo-accounts ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .demo-accounts li {
      padding: 3px 0;
    }
    
    .demo-accounts .username {
      font-weight: 600;
      color: var(--primary-color);
    }
    
    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-out;
    }
    
    /* Responsive */
    @media (max-width: 576px) {
      .login-container {
        padding: 15px;
      }
      
      .login-body {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="login-container fade-in">
    <div class="login-card">
      <div class="login-header">
        <h3><i class="fas fa-sign-in-alt me-2"></i>Login</h3>
        <p>Access your account to continue</p>
      </div>
      
      <div class="login-body">
        <form id="loginForm">
          <div class="mb-4">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
              <span class="input-group-text password-toggle" onclick="togglePassword()">
                <i class="fas fa-eye" id="passwordToggleIcon"></i>
              </span>
            </div>
          </div>

          <div class="d-grid mb-4">
            <button type="button" class="btn btn-primary" onclick="login()">
              <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
          </div>

          <!-- Alert placeholder -->
          <div id="loginAlert"></div>
        </form>
        
       
        
        <div class="login-footer">
          <a href="/" class="text-decoration-none">
            <i class="fas fa-arrow-left me-1"></i>Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const validCredentials = {
      "satish": "1234",
      "abhi": "hello",
      "savitri": "234"
    };

    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const alertDiv = document.getElementById("loginAlert");

      if (!username || !password) {
        showAlert("Please enter both username and password.", "danger");
        return;
      }

      // Simple loading indicator
      const loginBtn = document.querySelector('.btn-primary');
      const originalBtnText = loginBtn.innerHTML;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Logging in...';
      loginBtn.disabled = true;

      // Simulate network delay
      setTimeout(() => {
        if (validCredentials[username] === password) {
          showAlert("Login successful! Redirecting...", "success");
          
          // Simulate redirect
          setTimeout(() => {
            window.location.href = "/prediction"; // Change to your actual redirect URL
          }, 1500);
        } else {
          showAlert("Invalid username or password. Please try again.", "danger");
          loginBtn.innerHTML = originalBtnText;
          loginBtn.disabled = false;
        }
      }, 1000);
    }

    function showAlert(message, type) {
      const alertDiv = document.getElementById("loginAlert");
      alertDiv.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          <i class="${type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-triangle'} me-2"></i>
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
      
      // Auto dismiss after 5 seconds
      setTimeout(() => { 
        const alert = alertDiv.querySelector('.alert');
        if (alert) {
          alert.classList.remove('show');
          setTimeout(() => { alertDiv.innerHTML = ''; }, 300);
        }
      }, 5000);
    }

    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const icon = document.getElementById("passwordToggleIcon");
      
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        passwordInput.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    // Allow form submission with Enter key
    document.getElementById("password").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        login();
      }
    });

    // Focus on username field when page loads
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('username').focus();
    });

    // Add animation to alert
    const originalShowAlert = showAlert;
    showAlert = function(message, type) {
      const result = originalShowAlert.apply(this, arguments);
      const alert = document.querySelector('#loginAlert .alert');
      if (alert) {
        alert.classList.add('fade-in');
      }
      return result;
    };
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Medicine Overdose Prediction | Preview</title>

  <!-- Favicons -->
  <link href="../static/img/favicon.png" rel="icon">
  <link href="../static/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Roboto|Poppins" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="../static/vendor/animate.css/animate.min.css" rel="stylesheet">
  <link href="../static/vendor/aos/aos.css" rel="stylesheet">
  <link href="../static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../static/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link href="../static/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="../static/vendor/remixicon/remixicon.css" rel="stylesheet">
  <link href="../static/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="../static/css/style4.css" rel="stylesheet">

  <style>
    #loading {
      background: url('../static/ajax-loader.gif') no-repeat center center;
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      z-index: 9999999;
      display: none;
    }

    body {
      background-color: #f8f9fa;
    }
  </style>
</head>

<body>

  <!-- ======= Header ======= -->
  <header id="header" class="fixed-top d-flex align-items-center">
    <div class="container-fluid container-xl d-flex align-items-center justify-content-lg-between">
      <h1 class="col-lg-8"><a href="{{ url_for('first') }}">Medicine Overdose Prediction</a></h1>
      <nav id="navbar" class="navbar order-last order-lg-0">
        <ul>
          <li><a class="nav-link scrollto" href="{{ url_for('first') }}">Home</a></li>
          <li><a class="nav-link scrollto" href="{{ url_for('home') }}">Prediction</a></li>
          <li><a class="nav-link scrollto" href="{{ url_for('precautions') }}">Precautions</a></li>
        </ul>
      </nav>
    </div>
  </header><!-- End Header -->

  <!-- ======= Hero Section ======= -->
  <section id="hero" class="d-flex align-items-center">
    <div class="container text-center text-lg-start" data-aos="zoom-in" data-aos-delay="100">
      <h1><span>Medicine Overdose Prediction through Machine Learning Approaches</span></h1>
    </div>
  </section>
  <br><br><br>

  <main id="main">
    <!-- ======= Preview Section ======= -->
    <section id="preview" class="about">
      <div class="container" data-aos="fade-up">
        <div class="row">
          <div class="col-lg-12 text-center mb-4">
            <h2>Preview Dataset</h2>
          </div>
        </div>

        <div class="row justify-content-center">
          <div class="col-lg-10">
            <!-- Display the DataFrame as HTML table -->
            {{ df_view.to_html(classes="table table-striped table-bordered", na_rep="-") | safe }}
          </div>
        </div>

        <!-- Train | Test Button -->
        <div class="form-group text-center mt-4">
          <input type="button" onclick="showLoader()" class="btn btn-primary btn-lg" value="Click to Train | Test" />
        </div>
        <div id="loading"></div>

      </div>
    </section>
  </main>

  <!-- ======= Footer ======= -->
  <footer id="footer" class="mt-5">
    <div class="container text-center">
      <p>© 2025 Medicine Overdose Prediction</p>
    </div>
  </footer>

  <!-- Vendor JS Files -->
  <script src="../static/vendor/aos/aos.js"></script>
  <script src="../static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../static/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="../static/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="../static/vendor/swiper/swiper-bundle.min.js"></script>

  <!-- Template Main JS File -->
  <script src="../static/js/main.js"></script>

  <!-- Loader JS -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
  <script>
    function showLoader() {
      $('#loading').show(0).delay(10000).hide(0, function () {
        alert("Training finished!");
        window.location = "{{ url_for('home') }}";
      });
    }
  </script>
</body>

</html>

  <link href="{{ url_for('static', filename='vendor/aos/aos.css') }}" rel="stylesheet">

<body>
  <!-- ======= Header ======= -->
  <header id="header" class="fixed-top d-flex align-items-cente">
    <div class="container-fluid container-xl d-flex align-items-center justify-content-lg-between">
      <h1 class="col-lg-8"><a href="{{ url_for('first') }}"> <span>Medicine Overdose Prediction</span></a></h1>

      <nav id="navbar" class="navbar order-last order-lg-0">
        <ul>
          <li><a class="nav-link scrollto" href="{{ url_for('first')}}">Home</a></li>
          <li><a class="nav-link scrollto" href="{{ url_for('home')}}">Prediction</a></li>
          <li><a class="nav-link scrollto" href="{{ url_for('precautions')}}">Precautions</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <!-- End Header -->

  <!-- ======= Hero Section ======= -->
  <section id="hero" class="d-flex align-items-center">
    <div class="container position-relative text-center text-lg-start" data-aos="zoom-in" data-aos-delay="100">
      <div class="row">
        <div class="col-lg-8">
          <h1><span>Medicine Overdose Prediction through Machine Learning Approaches</span></h1>
        </div>
      </div>
    </div>
  </section> 

  <main id="main">
    <!-- ======= About Section ======= -->
    <section id="about" class="about">
      <div class="container" data-aos="fade-up">
        <div class="row">
          <div class="col-lg-4 ml-auto" style="margin-left:360px;">
            <center><h2>Preview</h2></center>
          </div>
        </div>
      </div>
    </section>

    <!-- Preview Section -->
    <section id="preview" class="page-section">
      <div class="container">
        <div class="row" style="margin-left:-250px">
          <div class="col-lg-8 mx-auto">
            {{ df_view.to_html(classes="table striped",na_rep="-") | safe }}
          </div>
        </div>

        <div class="form-group" style="padding:0px 250px 10px 40px;height:200px">
          <input style="margin-left:200px" type="button" onclick="hideLoader()" class="btn btn-primary" value="Click to Train | Test" />
          <div id="loading" style="display:none;"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ======= Footer ======= -->
  <footer id="footer">
    <div class="container">
      <div class="copyright"></div>
      <div class="credits"></div>
    </div>
  </footer>
  
  <!-- JS -->
  <script src="{{ url_for('static', filename='vendor/aos/aos.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>

  <script src="{{ url_for('static', filename='vendor/swiper/swiper-bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  <!-- Loader -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
  <script>
    function hideLoader() {  
      $('#loading').show(0).delay(10000).hide(0,function(){
        alert("Training finished!");
        window.location = "{{ url_for('home') }}";
      });    
    }
  </script>
</body>
</html>

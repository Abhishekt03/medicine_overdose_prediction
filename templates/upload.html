{% extends "base.html" %}

{% block body %}
<section id="hero" class="d-flex align-items-center" style="min-height: 40vh;">
  <div class="container text-center" data-aos="zoom-in" data-aos-delay="100">
    <h1>Upload Your Dataset</h1>
    <p>Upload a CSV file to preview and start prediction</p>
  </div>
</section>

<main id="main">
  <section id="upload" class="py-5">
    <div class="container" data-aos="fade-up">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm p-4">
            <h3 class="text-center mb-4"><i class="fas fa-upload me-2"></i>Upload Dataset</h3>

            <form action="{{ url_for('preview') }}" method="post" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="datasetfile" class="form-label"><strong>Select CSV File</strong></label>
                <input type="file" class="form-control" id="datasetfile" name="datasetfile" required>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-upload me-2"></i>Upload</button>
              </div>
            </form>

            {% if df_view %}
            <div class="mt-4">
              <h5 class="text-center">Preview of Dataset</h5>
              <div class="table-responsive">
                {{ df_view.to_html(classes="table table-striped", na_rep="-") | safe }}
              </div>
            </div>
            {% endif %}

          </div>
        </div>
      </div>
    </div>
  </section>
</main>

{% endblock %}
